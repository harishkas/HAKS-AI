[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "haks"
version = "0.1.0"
description = "HAKS — Personal AI Assistant with Modular Monolithic Architecture"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "HAKS Core Engineering Team" }
]
dependencies = [
    "PySide6==6.12.0",
    "pydantic==2.14.3",
    "python-dotenv==1.2.4",
    "httpx==0.28.1",
    "keyring==25.7.0",
    "cryptography==50.0.2",
    "sounddevice==0.5.6",
    "numpy==2.5.4",
    "edge-tts==7.3.1",
    "pyttsx3==2.99",
    "faster-whisper==1.2.1",
    "pvporcupine==4.0.3",
    "onnxruntime==1.31.1",
    "psutil==7.2.2",
    "pyautogui==0.9.54",
    "pywin32==312; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "asyncio: mark test as asyncio coroutine",
]
