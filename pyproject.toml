[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "haks"
version = "0.1.0"
description = "HAKS — Personal AI Assistant with Modular Monolithic Architecture"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "HAKS Core Engineering Team" }
]
dependencies = [
    "PySide6==6.12.0",
    "pydantic==2.14.3",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
